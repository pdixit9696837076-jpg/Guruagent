<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GuruAgent — Dynamic Dashboard</title>
<style>
:root {
  --bg: #F4EFE6;           /* Warm Rich Cream Background */
  --card: #FAF8F5;         /* Crisp White Cream Cards */
  --cream: #E7DFD3;        /* Soft Warm Accent Cream */
  --sb-bg: #1C1917;        /* Dark Espresso Sidebar Background */
  --sb-tx: #F5F5F4;        /* Light Cream Text for Sidebar */
  --sb-hover: #292524;     /* Dark Hover State */
  --tx: #26221F;           /* Deep Charcoal Text */
  --mu: #78716C;           /* Warm Muted Text */
  --bd: #DDD5C7;           /* Soft Warm Border */
  --ac: #D97706;           /* Warm Gold Amber Accent */
  --ac-dark: #B45309;      /* Dark Amber */
  --ok: #2E7D32;           /* Soft Green Success */
  --sh: 0 4px 16px rgba(40, 30, 20, 0.08);
  --sh-hover: 0 12px 28px rgba(180, 83, 9, 0.18);
  box-sizing: border-box;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
body { overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0 0 8px; font-weight: 700; }
p { margin: 8px 0; }
.mu { color: var(--mu); }

#app { display: flex; min-height: 100vh; }

/* Dark Espresso Collapsible Sidebar */
.sb {
  width: 240px;
  flex: none;
  background: var(--sb-bg);
  color: var(--sb-tx);
  border-right: 1px solid rgba(255,255,255,0.08);
  padding: 18px 12px;
  position: sticky;
  top: 0;
  align-self: flex-start;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
  z-index: 10;
}
.sb.c { width: 72px; }
.sb.c .lb { display: none; }
.sb.c .nv { justify-content: center; padding-inline: 10px; }

.logo {
  font-weight: 800;
  font-size: 19px;
  padding: 8px 12px;
  white-space: nowrap;
  color: #FDE68A;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.2s ease;
}
.logo:hover { transform: scale(1.03); }

/* Sidebar Items - Rich Hover */
.nv {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 11px 14px;
  border-radius: 12px;
  cursor: pointer;
  white-space: nowrap;
  color: #A8A29E;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.nv:hover {
  background: var(--sb-hover);
  color: #FDE68A;
  transform: translateX(4px);
}
.nv.on {
  background: var(--ac);
  color: #FFFFFF;
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(217, 119, 6, 0.4);
}
.nv.on:hover {
  background: var(--ac-dark);
  transform: translateX(4px) scale(1.01);
}
.nv span:first-child { width: 22px; text-align: center; font-size: 17px; }

/* Main Content Area */
.mn { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* Header Bar */
.hd {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  padding: 14px 28px;
  background: #231F1D;
  color: #FAF8F5;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: sticky;
  top: 0;
  z-index: 5;
}
.hd .btn.ghost { flex: none; }
.top-title { display: flex; align-items: center; gap: 10px; min-width: 150px; }
.top-title small { display: block; color: #A8A29E; font-weight: 500; font-size: 11px; }
.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.top-actions .btn.amber,
.top-actions .pill.dark {
  display: inline-flex;
  min-width: 148px;
  height: 40px;
  align-items: center;
  justify-content: center;
}

.pg { padding: 28px; max-width: 1120px; margin: 0 auto; width: 100%; }

/* Cards — FULL HOVER LIFT & GLOW EFFECT */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 20px;
  padding: 22px;
  box-shadow: var(--sh);
  margin-bottom: 20px;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card:hover {
  transform: translateY(-6px);
  box-shadow: var(--sh-hover);
  border-color: var(--ac);
}
.card.k { cursor: pointer; }
.section-action {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 14px;
  padding: 9px 14px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: rgba(255,255,255,.7);
  color: var(--tx);
  font-size: 13px;
  font-weight: 700;
  transition: transform .22s ease, background-color .22s ease, border-color .22s ease, box-shadow .22s ease;
}
.section-action:hover {
  transform: translateY(-2px);
  background: #FFF8EE;
  border-color: var(--ac);
  box-shadow: 0 6px 14px rgba(217,119,6,.16);
}
.section-action.amber {
  background: var(--ac);
  border-color: var(--ac);
  color: #FFF;
}
.section-action.amber:hover { background: var(--ac-dark); color: #FFF; }

.g2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; }
.g3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px;
  padding: 24px;
  margin-bottom: 20px;
  border-radius: 22px;
  color: #FFF7ED;
  background: radial-gradient(circle at 90% 10%, rgba(251,191,36,.25), transparent 34%), linear-gradient(135deg, #292524, #57534E);
  box-shadow: 0 14px 30px rgba(41,37,36,.2);
}
.hero h1 { color: #FFF7ED; margin-bottom: 4px; }
.hero p { color: #D6D3D1; margin: 0; }
.hero .btn { background: #F59E0B; color: #1C1917; }
.domain-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.domain-tool { border: 1px solid var(--bd); border-radius: 16px; padding: 16px; background: var(--card); transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
.domain-tool:hover { transform: translateY(-4px); border-color: var(--ac); box-shadow: var(--sh-hover); }
.domain-tool h3 { margin-bottom: 5px; font-size: 15px; }
.domain-tool p { margin: 0; color: var(--mu); font-size: 13px; }
.tool-row { display: flex; gap: 8px; margin-top: 12px; }
.tool-row input { min-width: 0; width: 100%; border: 1px solid var(--bd); border-radius: 9px; padding: 8px; font: inherit; }
.tool-row input:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(217,119,6,.14); }
.domain-tech { --ac: #506DB6; --ac-dark: #405B9D; --cream: #E9EEFB; }
.domain-tech .hero { background: radial-gradient(circle at 90% 10%, rgba(96,165,250,.3), transparent 34%), linear-gradient(135deg, #172554, #1E3A8A); }
.domain-accounting { --ac: #506DB6; --ac-dark: #405B9D; --cream: #E9EEFB; }
.domain-accounting .hero { background: radial-gradient(circle at 90% 10%, rgba(52,211,153,.3), transparent 34%), linear-gradient(135deg, #064E3B, #065F46); }
.domain-rural { --ac: #506DB6; --ac-dark: #405B9D; --cream: #E9EEFB; }
.domain-rural .hero { background: radial-gradient(circle at 90% 10%, rgba(163,230,53,.3), transparent 34%), linear-gradient(135deg, #365314, #3F6212); }
.metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.metric { padding: 15px 16px; border: 1px solid var(--bd); border-radius: 16px; background: rgba(250,248,245,.75); }
.metric strong { display: block; font-size: 24px; line-height: 1.1; }
.metric span { color: var(--mu); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
@media(max-width: 780px) {
  .g2 { grid-template-columns: 1fr; }
  .pg { padding: 18px; }
  .hd { padding: 12px 16px; }
  .sb { position: fixed; left: 0; top: 0; transform: translateX(0); box-shadow: 12px 0 30px rgba(0,0,0,.2); }
  .sb.c { width: 240px; transform: translateX(-100%); }
  .sb.c .lb { display: inline; }
  .top-title { min-width: 0; }
  .top-title small { display: none; }
  .top-actions { gap: 6px; }
  .top-actions .pill { display: none; }
  .top-actions .btn { padding: 9px 11px; font-size: 0; }
  .top-actions .btn::first-letter { font-size: 16px; }
  .hero { align-items: flex-start; flex-direction: column; }
  .metric-grid { grid-template-columns: 1fr; }
  .domain-tools { grid-template-columns: 1fr; }
}

/* Buttons — Hover Scale & Color Shift */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--tx);
  color: var(--bg);
  border: 0;
  border-radius: 12px;
  padding: 10px 18px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 6px 16px rgba(38, 34, 31, 0.25);
}
.btn.ghost { background: var(--cream); color: var(--tx); }
.btn.ghost:hover { background: #DDD3C1; }
.btn.amber { background: var(--ac); color: #FFF; }
.btn.amber:hover { background: var(--ac-dark); box-shadow: 0 6px 18px rgba(217, 119, 6, 0.35); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

/* Pills & Badges Hover */
.pill {
  display: inline-block;
  background: var(--cream);
  color: var(--tx);
  border-radius: 99px;
  padding: 5px 14px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s ease;
}
.pill:hover { transform: scale(1.05); background: #DCD2C0; }
.pill.dark { background: #342E2B; color: #FDE68A; }
.pill.dark:hover { background: #443C38; color: #FFF; }

/* Action Plan Items — HOVER SLIDE & HIGHLIGHT EFFECT */
.ti {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 16px;
  background: #FFF;
  border: 1px solid var(--bd);
  border-radius: 14px;
  margin-top: 8px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.ti:hover {
  transform: translateX(6px);
  background: #FFF8EE;
  border-color: var(--ac);
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.12);
}
.ti.dn { opacity: 0.55; text-decoration: line-through; background: rgba(231, 223, 211, 0.4); }
.ti.dn:hover { transform: translateX(4px); opacity: 0.8; }
.ti small { margin-left: auto; color: var(--mu); font-weight: 600; }

.bar { height: 10px; background: var(--cream); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.bar i { display: block; height: 100%; background: var(--ac); border-radius: 99px; transition: width 0.4s ease; }

/* Quiz Options — Hover Glow */
.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: #FFF;
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 11px 14px;
  margin-top: 8px;
  font: inherit;
  color: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
}
.opt:hover {
  background: #FFFDF9;
  border-color: var(--ac);
  transform: translateX(4px);
  box-shadow: 0 3px 10px rgba(0,0,0,0.05);
}
.opt.ok { background: rgba(46, 125, 50, 0.15); border-color: var(--ok); font-weight: 600; }
.opt.no { background: rgba(185, 28, 28, 0.15); border-color: #B91C1C; }

/* Onboarding Modal Overlay */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(28, 25, 23, 0.65);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 50;
}
.md {
  background: var(--card);
  border-radius: 24px;
  padding: 28px;
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  border: 1px solid var(--bd);
}
.chat-md {
  max-width: 760px;
  padding: 0;
  overflow: hidden;
  background: #171717;
  color: #F5F5F5;
  border: 1px solid #333;
  box-shadow: 0 28px 80px rgba(0,0,0,.45);
}
.chat-head { display:flex; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid #303030; }
.chat-avatar { width:36px; height:36px; display:block; border-radius:50%; background:#fff; object-fit:contain; padding:2px; border:2px solid #363744; }
.chat-head strong { display:block; font-size:15px; }
.chat-head small { color:#A3A3A3; }
.chat-skip { margin-left:auto; padding:7px 10px; border:1px solid #555; border-radius:8px; background:transparent; color:#E5E5E5; font:inherit; font-size:12px; cursor:pointer; }
.chat-skip:hover { border-color:#999; background:#292929; }
.chat-close { margin-left:0; border:0; color:#A3A3A3; background:transparent; font-size:20px; cursor:pointer; transition:color .2s, transform .2s; }
.chat-close:hover { color:#FFF; transform:rotate(90deg); }
.chat-body { min-height:330px; max-height:52vh; overflow:auto; padding:28px 24px 14px; }
.chat-welcome { text-align:center; padding:8px 0 20px; }
.chat-welcome h2 { color:#FFF; margin-bottom:8px; }
.chat-welcome p { color:#A3A3A3; max-width:540px; margin:0 auto; }
.chat-msg { display:flex; gap:10px; margin:14px 0; animation:chatIn .22s ease-out; }
.chat-msg.user { justify-content:flex-end; }
.chat-bubble { max-width:78%; padding:11px 14px; border-radius:16px 16px 16px 4px; background:#292929; color:#E5E5E5; white-space:pre-wrap; }
.chat-msg.user .chat-bubble { border-radius:16px 16px 4px 16px; background:#506DB6; color:#FFF; }
.chat-input-wrap { margin:8px 18px 18px; padding:8px 10px 8px 16px; display:flex; align-items:flex-end; gap:8px; border:1px solid #3A3A3A; border-radius:18px; background:#242424; transition:border-color .2s, box-shadow .2s; }
.chat-input-wrap:focus-within { border-color:#666; box-shadow:0 0 0 3px rgba(96,165,250,.14); }
.chat-input { flex:1; min-height:28px; max-height:100px; resize:none; margin:0; padding:5px 0; border:0; outline:0; background:transparent; color:#FFF; }
.chat-input::placeholder { color:#999; }
.chat-icon { width:32px; height:32px; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:#A3A3A3; cursor:pointer; transition:background .2s, color .2s, transform .2s; }
.chat-icon:hover { background:#3A3A3A; color:#FFF; transform:translateY(-1px); }
.chat-send { background:#11172E; color:#FFF; }
.chat-send:hover { background:#26345E; }
.chat-status { min-height:18px; padding:0 22px 10px; color:#A3A3A3; font-size:12px; }
.assistant-launcher { position:fixed; right:24px; bottom:24px; z-index:40; display:grid; place-items:center; width:56px; height:56px; padding:6px; border:0; border-radius:50%; background:#11172E; cursor:pointer; box-shadow:0 12px 28px rgba(17,23,46,.24); }
.assistant-launcher img { display:block; width:100%; height:100%; border-radius:10px; background:#FFF; object-fit:contain; }
.assistant-pop { position:fixed; right:24px; bottom:92px; z-index:41; display:flex; flex-direction:column; width:min(390px,calc(100vw - 32px)); height:min(540px,calc(100dvh - 116px)); overflow:hidden; border:1px solid #333; border-radius:20px; background:#171717; color:#F5F5F5; box-shadow:0 24px 60px rgba(0,0,0,.35); animation:chatIn .2s ease-out; }
.assistant-pop .chat-head { flex:none; }
.assistant-pop .chat-close { margin-left:auto; }
.assistant-pop .chat-body { flex:1; min-height:0; max-height:none; padding:18px; }
.assistant-pop .chat-welcome { padding:12px 0 8px; }
.assistant-pop .chat-welcome h2 { font-size:17px; }
.assistant-pop .chat-welcome p { font-size:13px; }
.assistant-pop .chat-input-wrap { flex:none; margin:8px 12px 12px; }
.assistant-pop .chat-status { flex:none; }
.assistant-pop .chat-bubble.ai { white-space:normal; line-height:1.6; }
.assistant-pop .chat-bubble.ai p { margin:6px 0; }
.assistant-pop .chat-bubble.ai ul,.assistant-pop .chat-bubble.ai ol { margin:6px 0 6px 20px; padding:0; }
.assistant-pop .chat-bubble.ai code { padding:2px 5px; border-radius:5px; background:#111827; color:#E5E7EB; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.92em; }
.assistant-pop .chat-bubble.ai pre { overflow:auto; padding:12px; border:1px solid #29334D; border-radius:9px; background:#0B1020; color:#E5E7EB; }
.assistant-pop .chat-bubble.ai h3 { margin:8px 0; color:#FFF; font-size:15px; }
.assistant-launcher:hover { transform:translateY(-3px); }
@media(max-width:560px) {
  .assistant-launcher { right:16px; bottom:16px; }
  .assistant-pop { right:12px; bottom:82px; width:calc(100vw - 24px); height:min(560px,calc(100dvh - 98px)); }
  .assistant-pop .chat-body { padding:16px; }
  .assistant-pop .chat-bubble { max-width:90%; }
}
@keyframes chatIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
@media(max-width:560px) { .chat-body { min-height:300px; padding:22px 16px 10px; } .chat-bubble { max-width:88%; } }
textarea {
  width: 100%;
  min-height: 160px;
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 14px;
  font: inherit;
  background: #FFF;
  color: inherit;
  resize: vertical;
  margin: 10px 0 14px;
  transition: border-color 0.2s;
}
textarea:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15); }
.intake-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { color: var(--mu); font-size: 12px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
.field input, .field select {
  width: 100%;
  border: 1px solid var(--bd);
  border-radius: 11px;
  padding: 10px 12px;
  font: inherit;
  color: inherit;
  background: #FFF;
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.field input:hover, .field select:hover { border-color: var(--ac); transform: translateY(-1px); }
.field input:focus, .field select:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px rgba(217,119,6,.15); }
.intake-note { padding: 10px 12px; border-radius: 11px; background: #FFF8EE; color: var(--mu); font-size: 13px; }
@media(max-width: 560px) { .intake-grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } }

.bd { text-align: center; }
.bd.lk { opacity: 0.4; filter: grayscale(1); }
.bd b { font-size: 36px; display: block; margin-bottom: 4px; }

.wk { display: flex; gap: 10px; align-items: flex-end; height: 130px; margin-top: 10px; }
.wk div { flex: 1; text-align: center; font-size: 12px; color: var(--mu); }
.wk i { display: block; background: var(--ac); border-radius: 6px 6px 0 0; min-height: 4px; margin-bottom: 6px; transition: height 0.3s; }

.st { font-size: 32px; font-weight: 800; color: var(--tx); }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--mu); text-transform: uppercase; margin: 16px 0 8px; }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1C1917;
  color: #F5F5F4;
  padding: 12px 24px;
  border-radius: 99px;
  font-weight: 600;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  z-index: 60;
}
</style>

<style>

  #app { display: block; min-height: 100dvh; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .sidebar {
    position: fixed;
    inset: auto 0 0;
    z-index: 30;
    width: 100%;
    height: calc(64px + env(safe-area-inset-bottom));
    padding: 5px 6px env(safe-area-inset-bottom);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    border-top: 1px solid var(--study-border);
    border-right: 0;
    background: #fbfaf7;
    box-shadow: 0 -8px 24px rgba(17, 23, 46, .08);
  }
  .sidebar .brand, .sidebar .sidebar-bottom { display: none; }
  .sidebar nav { width: 100%; flex-direction: row; justify-content: space-around; gap: 2px; }
  .sidebar nav a.nav-item {
    min-width: 0;
    min-height: 50px;
    flex: 1;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
    padding: 5px 2px;
    overflow: visible;
    border-radius: 9px;
  }
  .sidebar .nav-item > span:not(.nav-icon) {
    width: auto;
    opacity: 1;
    visibility: visible;
    overflow: visible;
    font-size: 9px;
    line-height: 1.1;
    text-align: center;
  }
  .sidebar .nav-icon { font-size: 15px; }
  .mn { width: 100%; min-width: 0; margin: 0; }

function local(data) {
  const t = [data.name, data.education, data.stream, data.year, data.syllabus, data.goal, data.weak, data.extra].filter(Boolean).join(' ');
  const T = { js: ['JavaScript', /javascript|\bjs\b/i], react: ['React', /react/i], python: ['Python', /python/i], dbms: ['DBMS', /\bdbms\b|database|sql/i], os: ['Operating Systems', /operating system|\bos\b/i], hindi: ['Hindi', /\bhindi\b|हिंदी/i], english: ['English', /\benglish\b/i], dsa: ['DSA', /\bdsa\b|data structure|algorithm/i], node: ['Node.js', /node|backend/i], html: ['HTML & CSS', /html|css|frontend/i] };
  const inferredGoal = window.GuruLearning?.inferGoal(t);
  const subject = data.stream || inferredGoal?.subject || 'General Studies';
  const language = window.GuruLearning?.inferLanguage(data.prompt || data.goal || '') || 'en';
  const keys = Object.keys(T).filter(x => T[x][0] === subject);
  const k = keys.length ? keys : ['gen'];
  if (!k.length) k = ['gen'];
  const nm = x => x === 'gen' ? 'Core Skills' : T[x][0];
  const resources = [], tasks = [], questions = [];
  const questionsForTopic = (key, topic) => {
    const list = key === 'hindi' && language === 'en'
      ? Q.hindiEnglish
      : Q[key] || Q.gen;
    const title = `${topic.title} ${topic.quizTopic}`.toLocaleLowerCase();
    const groups = {
      hindi: [/गद्य|prose|लेखक|passage|author/, /काव्य|कविता|poetry|अलंकार|rasa|poetic device/, /व्याकरण|grammar|संधि|समास|sentence structure/, /लेखन|पत्र|निबंध|writing|letter|essay/],
      dbms: [/fundamental|schema|model/, /sql|query|join/, /key|constraint/, /normaliz|functional dependenc/, /transaction|acid/, /er |relational design/],
      os: [/process state|operating-system|service/, /schedul|cpu/, /synchroniz|semaphore/, /deadlock/, /memory|paging/, /file system|disk/]
    };
    const subjectGroups = groups[key];
    if (!subjectGroups) return list;
    const groupIndex = subjectGroups.findIndex(pattern => pattern.test(title));
    if (groupIndex < 0) return list;
    if (key === 'hindi') {
      return list.filter((_, index) => index >= groupIndex * 2 && index < groupIndex * 2 + 2);
    }
    return list.filter((_, index) => index % subjectGroups.length === groupIndex);
  };

  if (window.GuruLearning) {
    const studyPlan = window.GuruLearning.buildPlan({ ...data, subject });
    studyPlan.prompt = data.prompt || data.goal || '';
    const fallbackQuestions = Q[k[0]] || Q.gen;
    studyPlan.topics.forEach(topic => {
      const topicQuestions = questionsForTopic(k[0], topic);
      const notes = language === 'hi'
        ? [
          `${topic.title} के मुख्य विचारों को पढ़ें।`,
          `${topic.practiceMinutes} मिनट इस विषय के प्रश्नों के उत्तर दें।`,
          `${topic.revisionMinutes} मिनट बिना नोट्स देखे याद करें और दोहराएँ।`
        ]
        : [
          `Learn the key ideas in ${topic.title}.`,
          `Spend ${topic.practiceMinutes} minutes answering questions about this topic.`,
          `Use ${topic.revisionMinutes} minutes for closed-book recall and review.`
        ];
      resources.push({
        title: language === 'hi' ? `Din ${topic.day}: ${topic.title}` : `Day ${topic.day}: ${topic.title}`,
        desc: language === 'hi'
          ? `${subject} के लिए केंद्रित अध्ययन सत्र: ${topic.learnMinutes} मिनट पढ़ें, अभ्यास करें और फिर दोहराएँ।`
          : `A focused ${subject} study block: learn for ${topic.learnMinutes} minutes, practice, then review.`,
        tag: language === 'hi' ? `Din ${topic.day}` : `Day ${topic.day}`,
        notes
      });
      tasks.push({
        title: language === 'hi'
          ? `दिन ${topic.day}: ${topic.title} पढ़ें (${topic.learnMinutes} मिनट)`
          : `Day ${topic.day}: Study ${topic.title} (${topic.learnMinutes} min)`,
        type: 'read',
        res: resources.length - 1
      });
      tasks.push({
        title: language === 'hi'
          ? `दिन ${topic.day}: ${topic.title} का अभ्यास (${topic.practiceMinutes} मिनट)`
          : `Day ${topic.day}: Practice ${topic.title} (${topic.practiceMinutes} min)`,
        type: 'quiz',
        target: Math.min(5, topicQuestions.length || fallbackQuestions.length),
        topicId: topic.topicId
      });
      (topicQuestions.length ? topicQuestions : fallbackQuestions).forEach(question => {
        questions.push({ q: question[0], opts: question[1], a: question[2], topic: topic.quizTopic, topicId: topic.topicId });
      });
    });
    return {
      ...data,
      stream: subject,
      language,
      daily: `${studyPlan.dailyMinutes} minutes/day`,
      duration: `${studyPlan.daysUntilExam} days`,
      skills: [subject],
      weak: data.weak ? [data.weak] : [],
      tasks,
      resources,
      questions,
      studyPlan
    };
  }

  k.forEach(x => {
    const n = nm(x);
    resources.push(
      { title: n + ' Fundamentals', desc: 'Core concepts of ' + n + ', step by step.', tag: 'Guide', notes: ['Start with core ideas.', 'Type out small examples.', 'Test your understanding.'] },
      { title: n + ' in Practice', desc: 'Hands-on exercises to lock in ' + n + '.', tag: 'Practice', notes: ['Pick a mini-project.', 'Break into 3 small steps.', 'Revisit mistakes.'] }
    );
    tasks.push(
      { title: 'Read: ' + n + ' Fundamentals', type: 'read', res: resources.length - 2 },
      { title: 'Read: ' + n + ' in Practice', type: 'read', res: resources.length - 1 }
    );
    Q[x].forEach(q => questions.push({ q: q[0], opts: q[1], a: q[2] }));
  });
  if (data.syllabus) {
    data.syllabus.split(/[,;\n]+/).map(x => x.trim()).filter(x => x.length > 2).slice(0, 5).forEach(subject => {
      resources.push({ title: subject + ' Study Guide', desc: 'A focused study path for ' + subject + ' based on your syllabus.', tag: 'Subject', notes: ['Read the chapter summary.', 'Practice important questions.', 'Revise before your next test.'] });
      tasks.push({ title: 'Read: ' + subject + ' Study Guide', type: 'read', res: resources.length - 1 });
    });
  }
  if (data.syllabus) {
    resources.push({ title: 'Your Syllabus Roadmap', desc: 'A personalized sequence built from your syllabus: ' + data.syllabus, tag: 'Your syllabus', notes: ['Start with the first unit.', 'Make short notes after each topic.', 'Revise weak areas with practice.'] });
    tasks.unshift({ title: 'Review: Your syllabus roadmap', type: 'read', res: resources.length - 1 });
  }
  tasks.push({ title: 'Answer 3 practice questions', type: 'quiz', target: 3 }, { title: 'Answer 3 more practice questions', type: 'quiz', target: 3 });

}

  else { S.tasks = []; S.res = []; S.qs = []; S.ans = {}; }
  const p = S.p;
  p.text = (upd && p.text ? p.text + '\n\n' : '') + text;
  ['name','education','stream','year','syllabus','goal','prompt','level','daily','duration','language'].forEach(k => { if (o[k]) p[k] = o[k]; });
  ['skills','weak'].forEach(k => {
    if (!Array.isArray(o[k])) return;
    p[k] = [...new Set(o[k])];
  });
  const ids = o.resources.map(r => {
    const id = 'r' + (++S.n);
    S.res.push({ id, title: String(r.title), desc: String(r.desc || ''), tag: r.tag || '', notes: Array.isArray(r.notes) ? r.notes : [] });
    return id;
  });
  o.tasks.forEach((t, i) => {
    if (S.tasks.some(x => x.title === t.title)) return;
    const rd = t.type !== 'quiz' && ids.length;
    S.tasks.push({ title: String(t.title), type: rd ? 'read' : 'quiz', res: rd ? ids[t.res] || ids[i % ids.length] : 0, target: t.target || 3, pr: 0, done: 0, topicId: t.topicId || '' });
  });
  o.questions.filter(q => q && Array.isArray(q.opts) && q.opts.length > 1 && q.opts[q.a] != null).forEach(q => S.qs.push({ q: String(q.q), o: q.opts, a: q.a }));
  if (!S.qs.length) Q.gen.forEach(q => S.qs.push({ q: q[0], o: q[1], a: q[2] }));
  if (o.studyPlan && window.GuruLearning) {
    const plan = o.studyPlan;
    const topics = plan.topics || [];
    plan.profile = {
      name: o.name || "",
      education: o.education || "",
      stream: o.stream || plan.subject,
      year: o.year || "",
      syllabus: o.syllabus || "",
      goal: o.goal || "",
      prompt: o.prompt || o.goal || "",
      language: o.language || window.GuruLearning?.inferLanguage(o.prompt || o.goal || "") || "en",
      weak: Array.isArray(o.weak) ? o.weak : (o.weak ? [o.weak] : []),
      level: o.level || "",
      daily: o.daily || "",
      duration: o.duration || ""
    };
    plan.questions = (o.questions || []).map((question, index) => {
      const requestedTopic = String(question.topic || "").trim().toLocaleLowerCase();
      const matchedTopic = topics.find(topic =>
        (question.topicId && topic.topicId === question.topicId) ||
        requestedTopic &&
        (topic.title.toLocaleLowerCase() === requestedTopic ||
          topic.title.toLocaleLowerCase().includes(requestedTopic) ||
          requestedTopic.includes(topic.title.toLocaleLowerCase()))
      ) || topics[index % Math.max(1, topics.length)];
      return {
        question: question.q,
        options: question.opts,
        answer: question.a,
        topic: matchedTopic?.quizTopic || question.topic || topics[0]?.quizTopic || plan.subject,
        topicId: matchedTopic?.topicId || topics[0]?.topicId || ""
      };
    });
    S.studyPlan = plan;
    window.GuruLearning.savePlan({
      ...plan
    });
  }
}

function parseGeneratedDashboard(reply, input) {
  const cleaned = String(reply || '').trim()
    .replace(/^```(?:json)?\s*/i, '')
    .replace(/\s*```$/, '');
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start < 0 || end <= start) throw new Error('The AI did not return dashboard data. Please try again.');

  let generated;
  try {
    generated = JSON.parse(cleaned.slice(start, end + 1));
  } catch {
    throw new Error('The AI returned invalid dashboard data. Please try again.');
  }
  if (!generated || typeof generated !== 'object' || Array.isArray(generated)) {
    throw new Error('The AI returned invalid dashboard data. Please try again.');
  }

  const text = value => typeof value === 'string' ? value.trim() : '';
  const resources = Array.isArray(generated.resources) ? generated.resources.slice(0, 20).map(resource => ({
    title: text(resource?.title),
    desc: text(resource?.desc),
    tag: text(resource?.tag) || 'Guide',
    notes: Array.isArray(resource?.notes) ? resource.notes.filter(note => typeof note === 'string').slice(0, 8) : []
  })) : [];
  const tasks = Array.isArray(generated.tasks) ? generated.tasks.slice(0, 30).map(task => ({
    title: text(task?.title),
    type: task?.type === 'quiz' ? 'quiz' : task?.type === 'read' ? 'read' : '',
    res: Number.isInteger(task?.res) ? task.res : 0,
    target: Number.isInteger(task?.target) ? Math.max(1, Math.min(task.target, 20)) : 3,
    topicId: text(task?.topicId)
  })) : [];
  const questions = Array.isArray(generated.questions) ? generated.questions.slice(0, 30).map(question => ({
    q: text(question?.q),
    opts: Array.isArray(question?.opts) ? question.opts.filter(option => typeof option === 'string').slice(0, 6) : [],
    a: question?.a,
    topic: text(question?.topic),
    topicId: text(question?.topicId)
  })).filter(question => question.q && question.opts.length > 1 && Number.isInteger(question.a) && question.a >= 0 && question.a < question.opts.length) : [];

  if (!resources.length || !tasks.length || !questions.length ||
      resources.some(resource => !resource.title) ||
      tasks.some(task => !task.title || !task.type || (task.type === 'read' && (task.res < 0 || task.res >= resources.length)))) {
    throw new Error('The AI response was missing valid tasks, resources, or practice questions. Please try again.');
  }

  const list = value => Array.isArray(value)
    ? value.filter(item => typeof item === 'string' && item.trim()).map(item => item.trim()).slice(0, 20)
    : [];
  const fallbackSkills = [text(input.stream), text(input.syllabus)].filter(Boolean);
  return {
    name: text(generated.name) || text(input.name) || 'Learner',
    education: text(generated.education) || text(input.education),
    stream: text(generated.stream) || text(input.stream) || text(input.goal),
    year: text(generated.year) || text(input.year),
    syllabus: text(generated.syllabus) || text(input.syllabus) || text(input.goal),
    goal: text(generated.goal) || text(input.goal),
    level: text(generated.level) || text(input.level),
    daily: text(generated.daily) || text(input.daily),
    duration: text(generated.duration) || text(input.duration),
    skills: list(generated.skills).length ? list(generated.skills) : fallbackSkills,
    weak: list(generated.weak).length ? list(generated.weak) : (text(input.weak) ? [text(input.weak)] : []),
    resources,
    tasks,
    questions
  };
}

async function requestGuruAgent(messages) {
  const response = await fetch(AI_CHAT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages })
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    const message = payload.error || (
      response.status === 404
        ? 'The AI chat endpoint was not found. Deploy the api/chat.js function and verify the configured AI service URL.'
        : `AI service returned HTTP ${response.status}`
    );
    throw new Error(message);
  }
  if (typeof payload.reply !== 'string' || !payload.reply.trim()) throw new Error('AI service returned an empty response.');
  return payload.reply.trim();
}

function syncPlanTasks(plan) {
  const topics = new Map((plan?.topics || []).map(topic => [topic.topicId, topic]));
  let changed = false;
  S.tasks.forEach(task => {
    if (!task.topicId || !topics.has(task.topicId)) return;
    const topic = topics.get(task.topicId);
    const progress = Math.min(task.target, Number(topic.attempts || 0));
    const completed = Boolean(topic.completed);
    if (task.pr !== progress || task.done !== Number(completed)) changed = true;
    task.pr = progress;
    task.done = Number(completed);
  });
  if (changed) save();
}

function formatChatReply(raw) {
  const parts = String(raw || '').replace(/\r/g, '').split(/```([\w#+.-]*)\n?([\s\S]*?)```/g);
  let html = '';
  for (let index = 0; index < parts.length; index += 3) {
    const prose = parts[index] || '';
    let list = '';
    for (const line of prose.split('\n')) {
      const text = line.trim();
      if (!text) { if (list) { html += `</${list}>`; list = ''; } continue; }
      const heading = text.match(/^#{1,3}\s+(.+)$/);
      if (heading) { if (list) { html += `</${list}>`; list = ''; } html += `<h3>${esc(heading[1])}</h3>`; continue; }
      const item = text.match(/^[-*]\s+(.+)$/) || text.match(/^\d+[.)]\s+(.+)$/);
      if (item) {
        const tag = /^\d+[.)]/.test(text) ? 'ol' : 'ul';
        if (list !== tag) { if (list) html += `</${list}>`; html += `<${tag}>`; list = tag; }
        html += `<li>${esc(item[1]).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')}</li>`;
        continue;
      }
      if (list) { html += `</${list}>`; list = ''; }
      html += `<p>${esc(text).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')}</p>`;
    }
    if (list) html += `</${list}>`;
    if (index + 1 < parts.length) html += `<pre><code>${esc(parts[index + 2] || '')}</code></pre>`;
  }
  return html || '<p>No response received.</p>';
}

}

function isPlanBuildConfirmation(message, conversation) {
  if (!/^(?:yes|yeah|yep|sure|okay|ok|please|go ahead|do it|haan|han|haanji|ji|theek hai|kar do|bana do|bna do)[.! ]*$/i.test(message.trim())) return false;

}

function parsePlanPrompt(prompt) {
  const p = S.p || {};
  const inferred = window.GuruLearning?.inferGoal(prompt) || {
    subject: 'General Studies', daysUntilExam: 7, dailyMinutes: 60,
    hasDuration: false, hasDailyTime: false
  };
  const explicitSubject = prompt.match(/(?:subject|stream|paper|exam|pariksha)\s*(?:is|:|-|ka|ki|ke)?\s*([\p{L}][\p{L}\s-]{1,30}?)(?=\s+(?:paper|exam|pariksha|in|is|hai|kal|parso|tomorrow|in\s+\d)|[,.;!?]|$)/iu);
  const subject = inferred.subject !== 'General Studies'
    ? inferred.subject
    : explicitSubject?.[1]?.trim() || p.stream || 'General Studies';
  const weakMatch = prompt.match(/(?:weak|kamzor|difficult|hard|mushkil)\s+(?:in|at|on|mein|me|area|topic)?\s*([^,.;!?]+)/i);
  const weakAfter = weakMatch?.[1]?.trim() || '';
  const weakBeforeMatch = prompt.match(/(?:^|[,;])\s*([^,;.!?]{2,50}?)\s+(?:is\s+)?(?:weak|kamzor|difficult|hard|mushkil)\b/i);
  const weakBefore = weakBeforeMatch?.[1]?.replace(/^(?:i am|i'm|mera|meri|mujhe|topic|area)\s+/i, '').trim() || '';
  const weak = /^(?:hai|hoon|hun|h|area|topic)$/i.test(weakAfter) ? weakBefore : weakAfter || weakBefore;
  const syllabusMatch = prompt.match(/(?:syllabus|topics?|chapters?|units?)\s*[:=-]\s*([^.;!?]+)/i);
  const duration = inferred.hasDuration ? inferred.daysUntilExam : 7;
  const dailyMinutes = inferred.hasDailyTime ? inferred.dailyMinutes : 60;
  const nameMatch = prompt.match(/(?:my name is|mera naam|my name:)\s*([\p{L}][\p{L}\s'-]{1,40})/iu);
  const goal = prompt.trim();
  const data = {
    name: p.name || nameMatch?.[1]?.trim() || 'Learner',
    education: p.education || 'College',
    stream: subject,
    year: p.year || '',
    syllabus: syllabusMatch?.[1]?.trim() || '',
    goal,
    prompt: goal,
    language,
    weak,
    level: p.level || 'Beginner',
    daily: `${dailyMinutes} minutes`,
    dailyMinutes,
    duration: `${duration} days`,
    daysUntilExam: duration
  };
  return data;
}

    const submit = $('#chat-form button[type="submit"]');
    if (submit) submit.disabled = true;
    const status = $('#chat-status');
    const shouldBuildDashboard = isDashboardChangeRequest(text) || isPlanBuildConfirmation(text, conversation.slice(0, -1));
    if (status) status.textContent = shouldBuildDashboard ? 'GuruAgent is preparing your dashboard…' : 'GuruAgent is thinking…';
    try {
      if (shouldBuildDashboard) {
        const planDetails = conversation.filter(message => message.role === 'user').map(message => message.content).join('\n');
        const requestedProfile = parsePlanPrompt(planDetails);
        const profile = upd && S.p ? {
          ...S.p,
          name: S.p.name || requestedProfile.name,
          goal: requestedProfile.goal || S.p.goal,
          stream: requestedProfile.stream === 'General Studies' ? S.p.stream : requestedProfile.stream,
          syllabus: requestedProfile.syllabus || S.p.syllabus,
          weak: requestedProfile.weak || S.p.weak,
          daily: window.GuruLearning?.inferGoal(planDetails)?.hasDailyTime ? requestedProfile.daily : S.p.daily,
          duration: window.GuruLearning?.inferGoal(planDetails)?.hasDuration ? requestedProfile.duration : S.p.duration,
          changeRequest: planDetails
        } : { ...requestedProfile, changeRequest: planDetails };
        const generated = await generateDashboard(profile, Boolean(upd));
        apply(generated, planDetails, upd);
        S.streak.last = Date.now();
        $('#modal').innerHTML = '';
        location.hash = '#/dashboard';
        chk();
        save();
        render();
        return;
      }

      const learnerContext = upd ? `Current learner profile and dashboard: ${JSON.stringify(chatContext())}` : 'This is a new learner setting up their dashboard.';
      const reply = await requestGuruAgent([
        {
          role: 'system',
          content: [
            'You are GuruAgent, a warm, capable personal learning assistant. Have a natural conversation and respond to greetings normally.',
            'Do not create, update, or return dashboard JSON unless the learner explicitly asks to create, set up, or change their dashboard or study plan.',
            'Help the learner describe their study plan. Ask a brief follow-up when useful about their subject, topics, exam/deadline, daily study time, level, or weak areas. Do not force the learner to provide every detail at once.',
            'When the learner shares plan details without asking to create a dashboard, acknowledge them and ask what they want to do next or whether they are ready to create it.',
            'Reply in Hindi or Hinglish when the learner writes in Hindi or Hinglish; otherwise reply in English. Keep the response friendly and concise.',
            learnerContext
          ].join('\n')
        },
        ...conversation.slice(-18)
      ]);
      conversation.push({ role: 'assistant', content: reply });
      if (status) status.textContent = '';
      renderConversation();
    } catch (error) {
      console.error('GuruAgent plan conversation failed.', error);
      const message = String(error?.message || 'AI service is temporarily unavailable.');
      conversation.push({ role: 'assistant', content: `I could not reach the AI service. ${message}` });
      if (status) status.textContent = '';
      renderConversation();
    } finally {
      input.disabled = false;
      if (submit) submit.disabled = false;
      if (input.isConnected) input.focus();
    }
  };
  input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#chat-form').requestSubmit(); } };
  input.focus();
}

document.addEventListener('click', e => {

  if (!el) return;

  if (el.dataset.a) {
    const [i, j] = el.dataset.a.split(':').map(Number);
    if (S.ans[i] == null) {
      S.ans[i] = j;
      log('Answered a question');
      ev('ans');
    }
    return;
  }
  if (el.dataset.act) {
    const a = el.dataset.act;
    if (a === 'toggle') { S.ui.sb = S.ui.sb ? 0 : 1; save(); render(); }
    else if (a === 'update') ask(1);
    else if (a === 'keep-plan') { $('#modal').innerHTML = ''; }
    else if (a === 'update-plan') ask(1);
    else if (a === 'logout') logout();
    else if (a === 'assistant-toggle') { assistantOpen = !assistantOpen; renderAssistant(); if (assistantOpen) $('#assistant-input')?.focus(); }
    else if (a === 'assistant-close') { assistantOpen = false; renderAssistant(); }
    else if (a === 'skip-setup') enterPreview();
    else if (a === 'calculate') calculateProfit();
    else if (a === 'chat-close') {
      if (S.p) { $('#modal').innerHTML = ''; save(); }
      else enterPreview();
    }
    else if (a === 'hide') { S.ui.hide = S.ui.hide ? 0 : 1; save(); render(); }
    else if (a === 'close') { clearInterval(rt); $('#modal').innerHTML = ''; save(); }
    else if (a === 'reset' && confirm('Reset all data and start over?')) { S = fresh(); save(); location.hash = '#/dashboard'; render(); }
    return;
  }
  if (e.target.closest('a')) return;
  const g = el.dataset.go;
  if (g.startsWith('res:')) reader(g.slice(4));
  else location.hash = g;
});

async function initializeDashboard() {
  const shouldOpenPlanPrompt = new URLSearchParams(window.location.search).get('openPlan') === '1';
  const supabase = window.supabaseClient;
  if (!supabase) {
    startDashboardPreview('Preview mode: sign in to save your dashboard.');
    return;
  }

  let session;
  try {
    const { data, error } = await supabase.auth.getSession();
    session = data?.session;
    if (error) {
      throw error;
    }
    if (!session?.user?.id) {
      startDashboardPreview('Preview mode: sign in to save your dashboard.');
      return;
    }
    if (shouldOpenPlanPrompt) {
      window.history.replaceState(null, '', `${window.location.pathname}${window.location.hash}`);
    }
  } catch (error) {
    console.error('Could not verify the signed-in user.', error);
    window.location.href = 'login.html';
    return;
  }

  K = `${LEGACY_K}:${session.user.id}`;
  try {
    const saved = localStorage.getItem(K);
    if (saved) {
      S = JSON.parse(saved) || fresh();
    } else {
      const legacy = localStorage.getItem(LEGACY_K);
      const legacyState = legacy ? JSON.parse(legacy) : null;
      S = legacyState?.p && !legacyState.p.preview ? legacyState : fresh();
      if (legacy) localStorage.removeItem(LEGACY_K);
      if (S.p) save();
    }
  } catch (error) {
    console.warn('Could not load the saved dashboard state.', error);
    S = fresh();
    localStorage.removeItem(K);
  }

  if (S.p?.preview) {
    S = fresh();
    localStorage.removeItem(K);
  }
  const sharedPlan = window.GuruLearning
    ? await window.GuruLearning.loadPlan()
    : null;
  if (!S.p && sharedPlan?.profile) {
    const learner = sharedPlan.profile;
    const profileData = {
      name: learner.name || session.user.user_metadata?.full_name || session.user.email?.split('@')[0] || 'Learner',
      education: learner.education || 'College',
      stream: learner.stream || sharedPlan.subject,
      year: learner.year || '',
      syllabus: learner.syllabus || sharedPlan.subject,
      goal: learner.goal || sharedPlan.goal,
      weak: Array.isArray(learner.weak) ? learner.weak.join(', ') : learner.weak || '',
      daily: learner.daily || `${sharedPlan.dailyMinutes} minutes`,
      duration: learner.duration || `${sharedPlan.daysUntilExam} days`,
      level: learner.level || 'Beginner'
    };
    const generated = local(profileData);
    delete generated.studyPlan;
    apply(generated, sharedPlan.goal, false);
    S.studyPlan = sharedPlan;
    save();
  } else if (S.p && sharedPlan) {
    S.studyPlan = sharedPlan;
  }
  if (sharedPlan) syncPlanTasks(sharedPlan);
  if (!S.chat || !Array.isArray(S.chat.messages)) S.chat = { messages: [] };
  S.chat.messages = S.chat.messages.filter(message => message && ['user', 'assistant'].includes(message.role) && typeof message.content === 'string').slice(-24);
  if (S.p) {
    if (S.streak.last && Date.now() - S.streak.last > 864e5) {
      S.streak.cur = 0;
      S.streak.day = '';
    }
    S.streak.last = Date.now();
    save();
  }
  render();
  if (shouldOpenPlanPrompt && S.p) ask(1);
}

  K = null;
